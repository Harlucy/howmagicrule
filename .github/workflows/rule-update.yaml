name: Rule-Update
on:
  schedule:
  - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: rule-update
  cancel-in-progress: true

jobs:
  rule-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Update ForcedDirect.SERVER.list
      run: |
        if [ -f rules/A-ForcedDirect.SERVER.update.list ]; then
          cat rules/A-ForcedDirect.SERVER.update.list | while read line; do
            line=$(echo "$line" | tr -d '\r' | xargs)
            if [ -z "$line" ] || [[ "$line" == \#* ]]; then
              continue
            fi
            
            if [[ "$line" =~ ^\[([0-9a-fA-F:]+)\]:([0-9]+)$ ]]; then
              ip="${BASH_REMATCH[1]}"
              port="${BASH_REMATCH[2]}"
              echo "AND,((IP-CIDR6,$ip/128,no-resolve),(OR,((DST-PORT,$port),(SRC-PORT,$port))))"
    
            elif [[ "$line" =~ ^\[([0-9a-fA-F:]+)\]$ ]]; then
              ip="${BASH_REMATCH[1]}"
              echo "IP-CIDR6,$ip/128,no-resolve"
    
            elif [[ "$line" =~ ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?):([0-9]+)$ ]]; then
              ip=${line%:*}
              port=${line##*:}
              echo "AND,((IP-CIDR,$ip/32,no-resolve),(OR,((DST-PORT,$port),(SRC-PORT,$port))))"
    
            elif [[ "$line" =~ ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$ ]]; then
              echo "IP-CIDR,$line/32,no-resolve"
    
            elif [[ "$line" =~ ^([a-zA-Z0-9.-]+):([0-9]+)$ ]]; then
              domain="${BASH_REMATCH[1]}"
              port="${BASH_REMATCH[2]}"
              echo "AND,((DOMAIN-SUFFIX,$domain),(OR,((DST-PORT,$port),(SRC-PORT,$port))))"
            else
              if [[ "$line" == *:* ]]; then
                 echo "IP-CIDR6,$line/128,no-resolve"
              else
                 echo "DOMAIN-SUFFIX,$line"
              fi
            fi
    
          done | sort -t, -k1,1 > rules/A-ForcedDirect.SERVER.list.new
          
          mv -f rules/A-ForcedDirect.SERVER.list.new rules/A-ForcedDirect.SERVER.list
          rm -rf rules/A-ForcedDirect.SERVER.update.list
        else
          echo "A-ForcedDirect.SERVER.update.list not found, skipping..."
        fi

    - name: Download ForcedDirect rules
      run: |
        files=(
          # "microsoft_cdn.list|https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/refs/heads/master/List/non_ip/microsoft_cdn.conf"
          # "apple_cdn.list|https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/refs/heads/master/List/non_ip/apple_cdn.conf"
          # "apple_cn.list|https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/refs/heads/master/List/non_ip/apple_cn.conf"
        )
        target_list="rules/A-ForcedDirect.list"
        manual_list="rules/A-ForcedDirect.MANUAL.list"
        exclude_patterns=(
          "^DOMAIN-SUFFIX,www.apple.com$"
          "^DOMAIN-SUFFIX,apps.apple.com$"
          "^DOMAIN-SUFFIX,appleid.cdn-apple.com$"
        )
        download_dir="rules/app"
        temp_files=()
        all_success=true
        echo "Attempting update for $target_list"
        mkdir -p "$download_dir"
        for entry in "${files[@]}"; do
          IFS='|' read -r filename url <<< "$entry"
          output_path="${download_dir}/$(basename ${target_list}).${filename}.tmp"
          temp_files+=("$output_path")
          
          echo "Downloading $filename from $url to $output_path..."
          if ! curl -f -L -s -o "$output_path" "$url" || [[ ! -s "$output_path" ]]; then
            echo "::error:: Failed download or empty file: $filename from $url for target $target_list"
            all_success=false
          else
            echo "Successfully downloaded $filename"
            echo >> "$output_path"
          fi
        done

        if $all_success; then
          echo "All downloads successful for $target_list. Combining..."
          combined_new="${target_list}.new"
          files_to_cat=()
          for f in "${temp_files[@]}"; do files_to_cat+=("$f"); done
          
          if [[ -f "$manual_list" && -s "$manual_list" ]]; then
            files_to_cat+=("$manual_list")
            echo "Including manual list: $manual_list"
          fi
          cat "${files_to_cat[@]}" > "$combined_new"
          if [ ${#exclude_patterns[@]} -gt 0 ]; then
            echo "Applying ${#exclude_patterns[@]} exclusion pattern(s)..."
            full_pattern=$(IFS='|'; echo "${exclude_patterns[*]}")
            echo "Filtering with combined regex: $full_pattern"
            filtered_new="${target_list}.filtered.new"
            grep -vE "$full_pattern" "$combined_new" > "$filtered_new"
            
            mv -f "$filtered_new" "$combined_new"
            echo "Filtering complete."
          else
            echo "No exclusion patterns defined. Skipping filtering."
          fi
          
          echo >> "$combined_new"
          mv -f "$combined_new" "$target_list"
          echo "Successfully updated $target_list"
        else
          echo "::warning:: $target_list was not updated due to one or more download failures."
        fi
        echo "Cleaning up temporary files for $target_list..."
        rm -f "${temp_files[@]}"

    - name: Append SERVER list to ForcedDirect rules
      run: |
        server_list="rules/A-ForcedDirect.SERVER.list"
        target_list="rules/A-ForcedDirect.list"
        if [[ -f "$server_list" && -s "$server_list" ]]; then
          echo "Found $server_list. Appending its content to $target_list..."
          echo >> "$target_list"
          cat "$server_list" >> "$target_list"
          echo >> "$target_list"
          echo "Successfully appended $server_list to $target_list."
        else
          echo "Skipping append: $server_list does not exist or is empty."
